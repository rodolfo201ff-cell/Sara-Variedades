<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SARA VARIEDADES | Loja Oficial em Belém</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}
body{background:#fff7f0}
header{background:#0f0f0f;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.logo{font-weight:800;font-size:22px;letter-spacing:1px}.logo span{color:#ff6a00}
.search{flex:1;min-width:200px;max-width:500px;display:flex;background:#fff;border-radius:30px;overflow:hidden}
.search input{flex:1;border:none;padding:10px 16px;outline:none}.search button{border:none;background:#ff6a00;color:#fff;padding:0 18px;font-weight:800;cursor:pointer}
.top-actions{display:flex;gap:8px}.pill{border:1px solid #333;background:#1e1e1e;color:#fff;padding:7px 12px;border-radius:20px;cursor:pointer;font-size:12px}
.hero{max-width:1200px;margin:14px auto;background:linear-gradient(100deg,#ff6a00 0%,#ff2e00 60%,#1a1a1a 100%);color:#fff;border-radius:18px;padding:22px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero h1{font-size:26px;line-height:1.1}.hero p{opacity:.9;margin-top:6px}.hero .cta{background:#fff;color:#ff3c00;border:none;padding:10px 18px;border-radius:12px;font-weight:800;cursor:pointer;margin-top:10px}
.container{max-width:1200px;margin:auto;padding:10px 14px}
.cats{display:flex;gap:10px;overflow:auto;padding:8px 0}.cat{min-width:84px;text-align:center;cursor:pointer}.cat img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.15)}.cat.active img{border-color:#ff6a00;transform:scale(1.05)}.cat span{font-size:12px;font-weight:600;display:block;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.07);position:relative}
.badge{position:absolute;top:8px;left:8px;background:#ff3c00;color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:20px}
.stock{position:absolute;top:8px;right:8px;background:#111;color:#fff;font-size:10px;padding:4px 7px;border-radius:20px}
.card img{width:100%;height:150px;object-fit:cover}.info{padding:10px}.info h3{font-size:13px;height:32px;overflow:hidden}.old{font-size:11px;color:#888;text-decoration:line-through}.price{font-size:18px;font-weight:800;color:#111}.pix{font-size:11px;color:#1a9e00;font-weight:600}.btn{width:100%;margin-top:8px;background:#ff6a00;color:#fff;border:none;padding:9px;border-radius:10px;font-weight:800;cursor:pointer}
.cartFloat{position:fixed;bottom:18px;right:18px;background:#25D366;color:#fff;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:60;cursor:pointer}
#admin{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:100;overflow:auto}#admin .box{max-width:800px;margin:30px auto;background:#fff;border-radius:16px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #eee;padding:8px;text-align:left}input.num{width:70px;padding:6px;border:1px solid #ddd;border-radius:8px}
</style>
</head>
<body>
<header>
<div class="logo">SARA <span>VARIEDADES</span></div>
<div class="search"><input id="busca" placeholder="O que você procura? ex: fone bluetooth"><button>Buscar</button></div>
<div class="top-actions">
<button class="pill" onclick="openAdmin('estoque')">📦 ESTOQUE</button>
<button class="pill" onclick="openAdmin('vendas')">📊 VENDAS</button>
<button class="pill" onclick="verCarrinho()">🛒 <span id="qtd">0</span></button>
</div>
</header>

<div class="container">
<div class="hero">
<div><h1>SEMANA TURBO SARA<br>ATÉ 50% OFF + FRETE GRÁTIS BELÉM</h1><p>Entrega no mesmo dia | Pague no Pix ou até 12x</p><button class="cta" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">Ver ofertas</button></div>
<div style="font-size:54px">🔥</div>
</div>

<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
</div>

<div class="cartFloat" onclick="verCarrinho()">W<br><span id="qtd2" style="font-size:12px">0</span></div>

<div id="admin"><div class="box">
<div style="display:flex;justify-content:space-between"><h2 id="adminTitle">Admin</h2><button onclick="closeAdmin()" style="border:none;background:#111;color:#fff;padding:6px 12px;border-radius:20px;cursor:pointer">Fechar</button></div>
<div id="adminContent" style="margin-top:12px"></div>
</div></div>

<script>
const PHONE="55919816524444";
const IMGS={
"Celulares":"https://images.unsplash.com/photo-1592899677977-9bb10ba128a5?w=500",
"Fones e Áudio":"https://images.unsplash.com/photo-1484704849700-f032a568e944?w=500",
"Caixas de Som":"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=500",
"Garrafas Térmicas":"https://images.unsplash.com/photo-1523369364227-2498b10a0c40?w=500",
"Utilidades":"https://images.unsplash.com/photo-1517705008128-361805f42e86?w=500",
"Acessórios":"https://images.unsplash.com/photo-1525598912003-663126343e1f?w=500"
};
let produtos=JSON.parse(localStorage.getItem('sara_prod'))||[
{id:1,nome:"Capinha Anti-Impacto iPhone/Samsung",cat:"Celulares",preco:29.9,old:49.9,estoque:23,img:IMGS["Celulares"]},
{id:2,nome:"Película 9D Curva",cat:"Celulares",preco:19.9,old:35,estoque:4,img:IMGS["Celulares"]},
{id:3,nome:"Fone Bluetooth TWS com Grave Forte",cat:"Fones e Áudio",preco:69.9,old:129.9,estoque:12,img:IMGS["Fones e Áudio"]},
{id:4,nome:"Fone com Fio Extra Bass",cat:"Fones e Áudio",preco:24.9,old:39.9,estoque:30,img:IMGS["Fones e Áudio"]},
{id:5,nome:"Caixa de Som JBL GO - Prova D'água",cat:"Caixas de Som",preco:149.9,old:249.9,estoque:7,img:IMGS["Caixas de Som"]},
{id:6,nome:"Caixa Amplificada 50W",cat:"Caixas de Som",preco:299.9,old:499,estoque:2,img:IMGS["Caixas de Som"]},
{id:7,nome:"Garrafa Térmica 500ml Inox",cat:"Garrafas Térmicas",preco:39.9,old:69.9,estoque:18,img:IMGS["Garrafas Térmicas"]},
{id:8,nome:"Garrafa Térmica 1L com Infusor",cat:"Garrafas Térmicas",preco:59.9,old:89.9,estoque:0,img:IMGS["Garrafas Térmicas"]},
];
let vendas=JSON.parse(localStorage.getItem('sara_vendas'))||[];
let carrinho=[]; let filtroCat='Todos'; let busca='';
function save(){localStorage.setItem('sara_prod',JSON.stringify(produtos)); localStorage.setItem('sara_vendas',JSON.stringify(vendas))}
function renderCats(){
  const cats=['Todos',...new Set(produtos.map(p=>p.cat))];
  document.getElementById('cats').innerHTML=cats.map(c=>`<div class="cat ${filtroCat===c?'active':''}" onclick="filtroCat='${c}';render()"><img src="${c==='Todos'?'https://placehold.co/100x100/ff6a00/fff?text=%F0%9F%94%A5':(IMGS[c]||IMGS['Utilidades'])}"><span>${c}</span></div>`).join('')
}
function render(){
  renderCats();
  let lista=produtos.filter(p=> (filtroCat==='Todos'||p.cat===filtroCat) && p.nome.toLowerCase().includes(busca.toLowerCase()));
  document.getElementById('grid').innerHTML=lista.map(p=>{
    const off=Math.round((1-p.preco/p.old)*100);
    const esgot=p.estoque<=0;
    return `<div class="card" style="${esgot?'opacity:.5':''}">
      <div class="badge">-${off}% OFF</div><div class="stock">${esgot?'ESGOTADO':p.estoque+' unid.'}</div>
      <img src="${p.img}"><div class="info"><h3>${p.nome}</h3><div class="old">R$ ${p.old.toFixed(2)}</div><div class="price">R$ ${p.preco.toFixed(2)}</div><div class="pix">R$ ${(p.preco*0.9).toFixed(2)} no Pix (10% OFF)</div><button class="btn" ${esgot?'disabled':''} onclick="add(${p.id})">${esgot?'Indisponível':'Adicionar 🛒'}</button></div></div>`
  }).join('')
}
function add(id){const p=produtos.find(x=>x.id===id); if(p.estoque<=0)return alert('Sem estoque!'); carrinho.push(p); p.estoque--; save(); updateQtd(); render()}
function updateQtd(){document.getElementById('qtd').innerText=carrinho.length; document.getElementById('qtd2').innerText=carrinho.length}
function verCarrinho(){
  if(!carrinho.length)return alert('Seu carrinho está vazio');
  let total=carrinho.reduce((s,p)=>s+p.preco,0); let txt=`Olá Sara Variedades! Quero:%0A`; carrinho.forEach(p=>txt+=`• ${p.nome} - R$ ${p.preco.toFixed(2)}%0A`); txt+=`%0ATotal: R$ ${total.toFixed(2)}%0AEntrega em Belém?`;
  vendas.push({data:new Date().toLocaleString(),itens:carrinho.length,total}); save(); carrinho=[]; updateQtd(); render(); window.open(`https://wa.me/${PHONE}?text=${txt}`,'_blank');
}
function openAdmin(t){
  document.getElementById('admin').style.display='block';
  if(t==='estoque'){
    document.getElementById('adminTitle').innerText='Controle de Estoque';
    document.getElementById('adminContent').innerHTML=`<table><tr><th>Produto</th><th>Preço</th><th>Estoque</th></tr>${produtos.map(p=>`<tr><td>${p.nome}</td><td><input class="num" type="number" step="0.01" value="${p.preco}" onchange="editPreco(${p.id},this.value)"></td><td><input class="num" type="number" value="${p.estoque}" onchange="editEstoque(${p.id},this.value)"></td></tr>`).join('')}</table><p style="margin-top:10px;font-size:12px">Dica: Estoque 0 = aparece como ESGOTADO automaticamente.</p>`;
  } else {
    const tot=vendas.reduce((s,v)=>s+v.total,0); const ticket=vendas.length?tot/vendas.length:0;
    document.getElementById('adminTitle').innerText='Controle de Vendas';
    document.getElementById('adminContent').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px"><div style="background:#fff3e6;padding:12px;border-radius:12px"><b>R$ ${tot.toFixed(2)}</b><br><small>Total Vendido</small></div><div style="background:#e8ffe8;padding:12px;border-radius:12px"><b>${vendas.length}</b><br><small>Vendas</small></div><div style="background:#eef1ff;padding:12px;border-radius:12px"><b>R$ ${ticket.toFixed(2)}</b><br><small>Ticket Médio</small></div></div><table><tr><th>Data</th><th>Itens</th><th>Total</th></tr>${vendas.slice(-20).reverse().map(v=>`<tr><td>${v.data}</td><td>${v.itens}</td><td>R$ ${v.total.toFixed(2)}</td></tr>`).join('')}</table><button onclick="if(confirm('Zerar vendas?')){vendas=[];save();openAdmin('vendas')}" style="margin-top:10px;background:#111;color:#fff;border:none;padding:8px 12px;border-radius:10px">Limpar histórico</button>`;
  }
}
function closeAdmin(){document.getElementById('admin').style.display='none'}
function editPreco(id,val){const p=produtos.find(x=>x.id===id); p.preco=parseFloat(val)||p.preco; save(); render()}
function editEstoque(id,val){const p=produtos.find(x=>x.id===id); p.estoque=parseInt(val)||0; save(); render()}
document.getElementById('busca').addEventListener('input',e=>{busca=e.target.value; render()});
render();
</script>
</body>
