<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara Variedades - Ofertas Imperdíveis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
header{background:#111;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:20px;color:#ff7a00}
#busca{flex:1;max-width:400px;padding:8px 12px;border-radius:20px;border:none;outline:none}
.cart{background:#ff5a00;color:#fff;border:none;padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:bold}
.banner{background:linear-gradient(90deg,#ff7a00,#ff3c00);color:#fff;text-align:center;padding:10px;font-weight:bold}
.container{padding:16px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px)}
.card img{width:100%;height:130px;object-fit:cover}
.card .info{padding:10px}
.card h3{font-size:14px;margin-bottom:6px}
.price{color:#ff5a00;font-weight:900}
.btn{width:100%;margin-top:8px;background:#111;color:#fff;border:none;padding:8px;border-radius:8px;cursor:pointer}
#produtosTitulo{margin:18px 0 10px;font-size:20px}
.wa{position:fixed;bottom:18px;right:18px;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:20}
</style>
</head>
<body>
<header>
<div class="logo">SARA VARIEDADES</div>
<input id="busca" placeholder="Buscar produto...">
<button class="cart" onclick="verCarrinho()">🛒 <span id="qtd">0</span></button>
</header>
<div class="banner">Só categorias na home. Clique e veja os produtos.</div>
<div class="container">
<div id="categorias" class="grid"></div>
<h2 id="produtosTitulo" style="display:none"></h2>
<div id="produtos" class="grid"></div>
</div>
<a class="wa" href="https://wa.me/55919816524444" target="_blank">W</a>

<script>
const PHONE="55919816524444";
const FALL="https://placehold.co/400x400/orange/white?text=Sara";
const IMGS={
"Celulares":"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400",
"Fones e Áudio":"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400",
"Caixas de Som":"https://images.unsplash.com/photo-1544474560-46686ee04356?w=400",
"Garrafas Térmicas":"https://images.unsplash.com/photo-1523369364227-2498b10a0c40?w=400",
"Utilidades":"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=400",
"Acessórios":"https://images.unsplash.com/photo-1525598912003-663126343e1f?w=400"
};

const produtos=[
{id:1,nome:"Capinha para Celular",cat:"Celulares",preco:25},
{id:2,nome:"Película 3D",cat:"Celulares",preco:15},
{id:3,nome:"Fone Bluetooth",cat:"Fones e Áudio",preco:49.90},
{id:4,nome:"Fone com Fio",cat:"Fones e Áudio",preco:19.90},
{id:5,nome:"Caixa de Som Pequena",cat:"Caixas de Som",preco:89.90},
{id:6,nome:"Caixa de Som Grande",cat:"Caixas de Som",preco:159.90},
{id:7,nome:"Garrafa Térmica 500ml",cat:"Garrafas Térmicas",preco:39.90},
{id:8,nome:"Garrafa Térmica 1L",cat:"Garrafas Térmicas",preco:59.90},
];

let q="";
let carrinho=[];
let categoriaAtiva=null;

function renderCategorias(){
  const cDiv=document.getElementById('categorias');
  const pDiv=document.getElementById('produtos');
  const cats=[...new Set(produtos.map(p=>p.cat))];
  const filtradas=cats.filter(cat=>cat.toLowerCase().includes(q.toLowerCase()));
  cDiv.innerHTML=filtradas.map(cat=>`
    <div class="card" onclick="abrirCategoria('${cat}')">
      <img src="${IMGS[cat]||FALL}" onerror="this.src='${FALL}'">
      <div class="info"><h3>${cat}</h3></div>
    </div>
  `).join('');
  if(!categoriaAtiva){pDiv.innerHTML="";document.getElementById('produtosTitulo').style.display='none'}
}

function abrirCategoria(cat){
  categoriaAtiva=cat;
  document.getElementById('produtosTitulo').style.display='block';
  document.getElementById('produtosTitulo').innerText=cat + ' - Produtos';
  renderProdutos();
  window.scrollTo({top:300,behavior:'smooth'});
}

function renderProdutos(){
  let lista=produtos.filter(p=>p.cat===categoriaAtiva);
  if(q) lista=lista.filter(p=>p.nome.toLowerCase().includes(q.toLowerCase()));
  document.getElementById('produtos').innerHTML=lista.map(p=>`
    <div class="card">
      <img src="${IMGS[p.cat]||FALL}">
      <div class="info">
        <h3>${p.nome}</h3>
        <div class="price">R$ ${p.preco.toFixed(2)}</div>
        <button class="btn" onclick="addCarrinho(${p.id})">Adicionar</button>
      </div>
    </div>
  `).join('');
}

function addCarrinho(id){
  const prod=produtos.find(p=>p.id===id);
  carrinho.push(prod);
  document.getElementById('qtd').innerText=carrinho.length;
}

function verCarrinho(){
  if(carrinho.length===0){alert('Carrinho vazio');return}
  let texto="Olá! Quero pedir na Sara Variedades:%0A";
  let total=0;
  carrinho.forEach(p=>{texto+=`- ${p.nome} R$ ${p.preco.toFixed(2)}%0A`; total+=p.preco});
  texto+=`%0ATotal: R$ ${total.toFixed(2)}`;
  window.open(`https://wa.me/${PHONE}?text=${texto}`,'_blank');
}

const buscaEl=document.getElementById('busca');
if(buscaEl){
  buscaEl.addEventListener('input', e=>{
    q=e.target.value;
    renderCategorias();
    if(categoriaAtiva) renderProdutos();
  });
}
renderCategorias();
</script>
</body>
</html>
