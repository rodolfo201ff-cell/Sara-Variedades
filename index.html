<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sara Variedades</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#faf6ee}
.topo{background:#15271c;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.topo b{font-family:Georgia;font-size:20px}.topo small{color:#c9a75a;letter-spacing:2px;font-size:10px}
#hb{background:none;border:0;color:#fff;font-size:28px;cursor:pointer}
.drawer{position:fixed;top:0;right:-300px;width:280px;height:100%;background:#15271c;color:#fff;padding:20px;transition:right .3s;z-index:100;overflow:auto}
.drawer.open{right:0}
.drawer a{display:flex;gap:10px;color:#fff;text-decoration:none;padding:13px;border-radius:10px;margin:4px 0}
.drawer a.on,.drawer a:hover{background:#a17c36}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:90}.fundo.on{display:block}
.wrap{max-width:1100px;margin:auto}
.hero{padding:20px}.hero h1{font-family:Georgia;font-size:30px;margin:0}.hero p{color:#a17c36}
.banner{background:#15271c;color:#fff;border-radius:14px;padding:22px;text-align:center;margin-top:10px}
.busca{padding:0 20px}.busca input{width:100%;padding:12px;border-radius:25px;border:1px solid #ddd}
.cats{display:flex;gap:8px;padding:12px 20px;overflow:auto}.cat{padding:8px 14px;background:#fff;border:1px solid #ddd;border-radius:20px;white-space:nowrap;cursor:pointer}.cat.on{background:#a17c36;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:12px 20px 100px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee}
.card img{width:100%;height:200px;object-fit:contain;background:#fff;display:block}
.box{padding:10px}.tag{font-size:10px;color:#a17c36;border:1px solid #a17c36;border-radius:10px;padding:3px 7px}.nome{font-family:Georgia;margin:6px 0;font-size:15px}.preco{color:#a17c36;font-weight:bold}.add{width:100%;margin-top:8px;background:#15271c;color:#fff;border:0;padding:10px;border-radius:8px}
.pg{display:none}.pg.on{display:block}
.zap{position:fixed;bottom:16px;right:16px;background:#25d366;color:#fff;padding:12px 18px;border-radius:30px;text-decoration:none;font-weight:bold;
