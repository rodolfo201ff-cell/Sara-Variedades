<style>
:root{--verde:#15271c;--ouro:#a17c36;--bege:#faf6ee}

.drawer a.on{background:var(--ouro)}

.sec-t{font-family:Georgia,serif;font-size:30px;padding:28px 20px 0;margin:0}

.pg{display:none;padding:20px}.pg.on{display:block}
