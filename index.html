const CATS=[{c:"Celulares",ico:"📱",cor:"#e3f2fd"},{c:"Fones e Áudio",ico:"🎧",cor:"#fce4ec"},{c:"Caixas de Som",ico:"🔊",cor:"#fff3e0"},{c:"Garrafas Térmicas",ico:"🥤",cor:"#e8f5e9"},{c:"Áudio e Vídeo",ico:"📺",cor:"#f3e5f5"},{c:"Casa e Cozinha",ico:"🍳",cor:"#fffde7"},{c:"Beleza e Cuidados",ico:"💄",cor:"#fce4ec"},{c:"Organização",ico:"🗄️",cor:"#e0f2f1"}];
let catAtiva=null,q="",carr=[];
function renderCategorias(){
 document.getElementById('catGrid').style.display='grid';
 document.getElementById('header').classList.remove('on');
 document.getElementById('grid').classList.remove('on');
 const g=document.getElementById('catGrid');g.innerHTML='';
 CATS.forEach(cat=>{
  let qt=PROD.filter(p=>p.c==cat.c).length;
  let d=document.createElement('div');d.className='cat';d.style.background=cat.cor;
  d.innerHTML=`<div class="ico">${cat.ico}</div><div class="tit">${cat.c}</div><div class="qtd">${qt} produtos</div><div style="font-size:11px;color:#ff0040;margin-top:6px;font-weight:800">Ver agora →</div>`;
  d.onclick=()=>abrir(cat.c);
  g.appendChild(d);
 });
}
function abrir(c){
 catAtiva=c;
 document.getElementById('catGrid').style.display='none';
 document.getElementById('header').classList.add('on');
 document.getElementById('grid').classList.add('on');
 let lista=PROD.filter(p=>p.c==c);
 document.getElementById('hTit').textContent=c;
 document.getElementById('hQtd').textContent=lista.length+' produtos';
 renderProds();
}
function voltar(){catAtiva=null;document.getElementById('busca').value='';q='';renderCategorias();}
function filtrar(){let l=PROD;if(catAtiva)l=l.filter(p=>p.c==catAtiva);if(q)l=l.filter(p=>p.n.toLowerCase().includes(q.toLowerCase()));return l;}
function renderProds(){
 let lista=filtrar();
 let g=document.getElementById('grid');g.innerHTML='';
 lista.forEach(p=>{
  let off=Math.round((1-p.o/p.p)*100);
  let div=document.createElement('div');div.className='card';
  div.innerHTML=`<div class="imgW"><img src="${p.img}" onerror="this.src='${FALL}'"><span class="off">${off}% OFF</span><span class="est">${p.est} un</span></div><div class="info"><div class="nm">${p.n}</div><div class="pr">R$ ${p.o.toFixed(2)}</div><button class="btn" onclick="add(${p.id})">Adicionar</button></div>`;
  g.appendChild(div);
 });
}
function add(id){let p=PROD.find(x=>x.id==id);let f=carr.find(x=>x.id==id);if(f){if(f.qtd>=p.est)return alert('Máximo estoque '+p.est);f.qtd++}else carr.push({...p,qtd:1});upd();document.getElementById('cartBox').classList.add('on')}
function upd(){
 document.getElementById('cc').textContent=carr.reduce((s,i)=>s+i.qtd,0);
 let tot=carr.reduce((s,i)=>s+i.o*i.qtd,0);
 document.getElementById('tot').textContent='R$ '+tot.toFixed(2);
 let l=document.getElementById('lista');l.innerHTML='';
 carr.forEach((it,i)=>{l.innerHTML+=`<div style="display:flex;gap:6px;border:1px solid #eee;padding:6px;border-radius:8px"><img src="${it.img}" onerror="this.src='${FALL}'" style="width:40px;height:40px;object-fit:cover;border-radius:6px"><div style="flex:1"><div style="font-size:11px;font-weight:700">${it.n}</div><div><button onclick="chg(${i},-1)">-</button> ${it.qtd} <button onclick="chg(${i},1)">+</button></div></div><b>R$ ${(it.o*it.qtd).toFixed(2)}</b></div>`});
}
function chg(i,d){carr[i].qtd+=d;if(carr[i].qtd<=0)carr.splice(i,1);upd()}
function toggleCart(){document.getElementById('cartBox').classList.toggle('on')}
function zap(){if(!carr.length)return alert('Carrinho vazio');let m='Olá Sara Variedades! Quero:%0A';carr.forEach(it=>{m+=`- ${it.n} x${it.qtd} R$ ${(it.o*it.qtd).toFixed(2)}%0A`});window.open('https://wa.me/5591999998888?text='+m,'_blank')}
document.getElementById('busca').addEventListener('input',e=>{q=e.target.value.toLowerCase();if(q.length>1){catAtiva=null;document.getElementById('catGrid').style.display='none';document.getElementById('header').classList.add('on');document.getElementById('grid').classList.add('on');document.getElementById('hTit').textContent='Busca: '+q;document.getElementById('hQtd').textContent='';renderProds();}else if(q.length==0){renderCategorias();}else renderProds()});
