<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#fff5f7}
.top{background:#111;color:#fff;display:flex;gap:10px;align-items:center;padding:12px 16px;position:sticky;top:0;z-index:9;flex-wrap:wrap}
.logo{font-weight:800}
.sch{flex:1;max-width:500px;background:#222;border-radius:999px;padding:8px 14px;display:flex;gap:8px}
.sch input{flex:1;background:transparent;border:0;color:#fff;outline:none}
.hero{background:linear-gradient(90deg,#ff0c6b,#ff5a5a);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.cats{display:flex;gap:8px;overflow:auto;padding:12px 16px}
.cat{padding:8px 14px;border-radius:999px;border:2px solid #eee;background:#fff;font-weight:700;white-space:nowrap;cursor:pointer}
.cat.a{background:#ff2d78;color:#fff;border-color:#ff2d78}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px 16px}
.card{background:#fff;border-radius:12px;border:1px solid #ffd6de;overflow:hidden}
.card-top{height:100px;display:grid;place-items:center;background:#fff0f3;font-size:20px;font-weight:800}
.card-b{padding:8px 10px}
.price{color:#ff2d78;font-weight:800}
.btn{background:#ff2d78;color:#fff;border:0;padding:8px;border-radius:8px;font-weight:800;width:100%;margin-top:6px;cursor:pointer}
.badge{position:relative;cursor:pointer}
.bc{position:absolute;top:-6px;right:-6px;background:#ff2d78;color:#fff;width:18px;height:18px;border-radius:999px;display:grid;place-items:center;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:20}
.modal.o{display:grid}
.sheet{background:#fff;padding:14px;border-radius:12px;width:min(420px,92vw)}
.tag{position:absolute;top:6px;left:6px;background:#ff2d78;color:#fff;font-size:10px;padding:3px 6px;border-radius:999px}
</style>
</head>
<body>
<div class="top">
<div class="logo">Sara Variedades - Belem PA</div>
<div class="sch"><input id="q" placeholder="Buscar..."></div>
<div class="badge" onclick="tog()"><span>CARRINHO</span> <b class="bc" id="cc">0</b></div>
</div>

<div id="cnt" style="padding:0 16px;font-size:12px;color:#888"></div>
<div class="grid" id="grid"></div>

const CATS=["Elétricos","Iluminação","Utilidades","Cozinha","Organização","Banheiro","Decoração"];
let act="Elétricos",q="",cart=[];
function renderCats(){
let c=document.getElementById('cats');c.innerHTML='';
let b=document.createElement('button');b.className='cat'+(act=='Todos'?' a':'');b.textContent='Todos';b.onclick=function(){act='Todos';render()};c.appendChild(b);
CATS.forEach(function(k){
let e=document.createElement('button');e.className='cat'+(act==k?' a':'');e.textContent=k;e.onclick=function(){act=k;render()};c.appendChild(e)
});
}
function filtered(){return DATA.filter(function(p){return (act=='Todos'||p.c==act)&&(!q||p.n.toLowerCase().indexOf(q.toLowerCase())>=0)})}
function render(){
renderCats();
let list=filtered();
document.getElementById('cnt').textContent=list.length+' produtos em '+act;
document.getElementById('tit').textContent=act;
let g=document.getElementById('grid');g.innerHTML='';
list.forEach(function(p,i){
let off=p.o?Math.round((1-p.o/p.p)*100):0;
let d=document.createElement('div');d.className='card';
d.innerHTML='<div class="card-top">'+p.c+' '+(off?'<span class=tag>'+off+'% OFF</span>':'')+'</div><div class="card-b"><div style="font-size:12px;min-height:32px">'+p.n+'</div><div style="color:#f5a623;font-size:11px">***** ('+p.v+')</div><div class="price">'+(p.o?'R$ '+p.o.toFixed(2)+' <small style="color:#999;text-decoration:line-through">R$ '+p.p.toFixed(2)+'</small>':'R$ '+p.p.toFixed(2))+'</div><button class="btn" onclick="add('+i+')">Adicionar</button></div>';
g.appendChild(d)
});
upd();
}
function add(i){let p=DATA[i];let f=cart.find(function(x){return x.n==p.n});if(f)f.qtd++;else cart.push({n:p.n,c:p.c,p:p.p,o:p.o,v:p.v,qtd:1});upd();document.getElementById('modal').classList.add('o')}
function upd(){
document.getElementById('cc').textContent=cart.reduce(function(s,i){return s+i.qtd},0);
let tot=cart.reduce(function(s,i){return s+(i.o||i.p)*i.qtd},0);
document.getElementById('tot').textContent='R$ '+tot.toFixed(2);
let l=document.getElementById('list');l.innerHTML='';
cart.forEach(function(i){l.innerHTML+='<div style="display:flex;justify-content:space-between;border:1px solid #ffd6de;padding:6px;border-radius:8px"><span>'+i.n+' x'+i.qtd+'</span><b>R$ '+((i.o||i.p)*i.qtd).toFixed(2)+'</b></div>'})
}
function tog(){document.getElementById('modal').classList.toggle('o')}
function zap(){if(!cart.length)return alert('vazio');let m='Ola Sara! Quero:%0A';cart.forEach(function(i){m+='- '+i.n+' x'+i.qtd+'%0A'});window.open('https://wa.me/5591999999999?text='+m,'_blank')}
document.getElementById('q').addEventListener('input',function(e){q=e.target.value;render()});
render();
