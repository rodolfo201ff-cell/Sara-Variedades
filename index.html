<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sara Variedades</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter;background:#faf6ef}.serif{font-family:'Playfair Display',serif}.bgv{background:#122419}.gold{color:#a07a3a}.bgold{background:#a07a3a}</style></head><body>
<header class="bgv text-white p-3 flex items-center gap-3 sticky top-0 z-40"><div class="w-10 h-10 rounded-full bgold flex items-center justify-center">🏪</div><div><div class="serif text-xl">Sara Variedades</div><div class="text-[10px] tracking-widest gold">IMPORTADOS & VARIEDADES</div></div><button onclick="M(1)" class="ml-auto text-2xl">☰</button></header>
<div id="mb" onclick="M(0)" class="fixed inset-0 bg-black/50 hidden z-50"></div><nav id="mn" class="fixed top-0 right-0 h-full w-[280px] bgv text-white z-50 p-5" style="transform:translateX(100%);transition:.3s"><div class="flex justify-between mb-4"><span class="serif text-xl">Menu</span><button onclick="M(0)">✕</button></div><button onclick="G('v')" class="w-full text-left p-3 rounded-xl bgold font-bold mb-1">🏪 Vitrine</button><button onclick="G('p')" class="w-full text-left p-3 hover:bg-white/10 rounded-xl">🧮 PDV</button><button onclick="G('e')" class="w-full text-left p-3 hover:bg-white/10 rounded-xl">📦 Estoque</button><button onclick="G('r')" class="w-full text-left p-3 hover:bg-white/10 rounded-xl">📊 Relatórios</button><button onclick="G('h')" class="w-full text-left p-3 hover:bg-white/10 rounded-xl">🧾 Histórico</button><button onclick="G('b')" class="w-full text-left p-3 hover:bg-white/10 rounded-xl">⚠️ Estoque baixo</button><button onclick="G('c')" class="w-full text-left p-3 hover:bg-white/10 rounded-xl">⚙️ Configurações</button></nav>
<main class="max-w-[1000px] mx-auto p-4 pb-24">
<section id="s-v"><span class="border rounded-full px-3 py-1 text-xs gold border-[#e8d9b8]">✨ IMPORTADOS DIRETO DA CHINA</span><h1 class="serif text-3xl mt-3">Tudo para sua casa,<br>diversão e tecnologia</h1><div class="mt-4 bg-white rounded-full flex px-4 py-2 border"><input id="q" placeholder="Buscar na vitrine..." class="flex-1 outline-none bg-transparent" oninput="QR(this.value)"></div><div id="cats" class="flex gap-2 overflow-auto mt-3 pb-2"></div><div id="grid" class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-3"></div></section>
<section id="s-p" class="hidden"><h2 class="serif text-2xl">PDV</h2><div class="bg-white rounded-2xl p-4 mt-2"><div id="pl"></div><div class="font-bold mt-3">Total R$ <span id="pt">0.00</span></div><button onclick="PF()" class="w-full bgv text-white py-3 rounded-xl mt-2 font-bold">Finalizar venda</button></div></section>
<section id="s-e" class="hidden"><h2 class="serif text-2xl">Estoque</h2><button onclick="NP()" class="bgold text-white px-4 py-2 rounded-xl mt-2">+ Novo produto</button><div id="el" class="mt-3 space-y-2"></div></section>
<section id="s-r" class="hidden"><h2 class="serif text-2xl">Relatórios</h2><div id="rb" class="grid grid-cols-2 gap-2 mt-3"></div></section>
<section id="s-h" class="hidden"><h2 class="serif text-2xl">Histórico</h2><div id="hl" class="mt-3 space-y-2"></div></section>
<section id="s-b" class="hidden"><h2 class="serif text-2xl">Estoque baixo</h2><div id="bl" class="mt-3 space-y-2"></div></section>
<section id="s-c" class="hidden"><h2 class="serif text-2xl">Configurações</h2><div class="bg-white rounded-2xl p-4 mt-2 space-y-2"><input id="cz" placeholder="WhatsApp só números" class="w-full border rounded-xl p-2"><input id="cn" placeholder="Nome loja" class="w-full border rounded-xl p-2"><button onclick="SC()" class="bgold text-white px-4 py-2 rounded-xl">Salvar</button></div></section>
</main>
<button onclick="CT(1)" class="fixed bottom-5 right-5 bgv text-white w-14 h-14 rounded-full z-40">🛒<span id="cq" class="absolute -top-1 -right-1 bg-red-600 text-xs w-6 h-6 rounded-full flex items-center justify-center">0</span></button>
<div id="cb" onclick="CT(0)" class="fixed inset-0 bg-black/50 hidden z-50"></div><aside id="cn2" class="fixed top-0 right-0 h-full w-[320px] bg-white z-50 p-5 flex flex-col" style="transform:translateX(100%);transition:.3s"><h3 class="serif text-xl">Seu pedido</h3><div id="ci" class="flex-1 overflow-auto mt-2"></div><div class="font-bold">Total R$ <span id="ct">0.00</span></div><button onclick="WZ()" class="w-full bgv text-white py-3 rounded-xl mt-2 font-bold">Chamar no WhatsApp</button></aside>
<script>
let C=JSON.parse(localStorage.getItem('sc')||'{"z":"5591981652444","n":"Sara Variedades"}');
let P=JSON.parse(localStorage.getItem('sp')||'null')||[{id:1,n:"Carregador Turbo 33W",c:"Eletrônicos",p:34.9,e:12},{id:2,n:"Fone Bluetooth TWS",c:"Eletrônicos",p:69.9,e:15},{id:3,n:"Relógio Couro Clássico",c:"Relógios",p:89.9,e:2},{id:4,n:"Kit 3 Potes Herméticos",c:"Casa",p:59.9,e:8}];
let V=JSON.parse(localStorage.getItem('sv')||'[]');let cart=[],F='Todos',B='';
const S=()=>{localStorage.setItem('sp',JSON.stringify(P));localStorage.setItem('sv',JSON.stringify(V));localStorage.setItem('sc',JSON.stringify(C))};
function M(o){document.getElementById('mn').style.transform=o?'translateX(0)':'translateX(100%)';document.getElementById('mb').classList.toggle('hidden',!o)}
function CT(o){document.getElementById('cn2').style.transform=o?'translateX(0)':'translateX(100%)';document.getElementById('cb').classList.toggle('hidden',!o);if(o)RC()}
function G(s){M(0);['v','p','e','r','h','b','c'].forEach(x=>document.getElementById('s-'+x).classList.add('hidden'));document.getElementById('s-'+s).classList.remove('hidden');if(s=='e')RE();if(s=='r')RR();if(s=='h')RH();if(s=='b')RB();if(s=='p')RP();if(s=='c'){document.getElementById('cz').value=C.z;document.getElementById('cn').value=C.n}}
function QR(v){B=v;R()}
function R(){let cs=['Todos',...new Set(P.map(p=>p.c))];document.getElementById('cats').innerHTML=cs.map(c=>`<button onclick="F='${c}';R()" class="px-4 py-2 rounded-full border text-sm whitespace-nowrap ${F===c?'bgold text-white':'bg-white'}">${c}</button>`).join('');let L=P.filter(p=>(F=='Todos'||p.c==F)&&p.n.toLowerCase().includes(B.toLowerCase()));document.getElementById('grid').innerHTML=L.map(p=>`<div class="bg-white rounded-2xl overflow-hidden border"><div class="h-32 bg-[#eee] flex items-center justify-center text-4xl">📦</div><div class="p-3"><div class="serif text-sm h-10 overflow-hidden">${p.n}</div><div class="gold font-bold text-lg">R$ ${p.p.toFixed(2)}</div><div class="text-[11px] text-gray-500">${p.e} em estoque</div><button ${p.e<=0?'disabled':''} onclick="AC(${p.id})" class="w-full bgv text-white py-2 rounded-xl mt-2 text-sm font-bold">Adicionar</button></div></div>`).join('')}
function AC(id){let p=P.find(x=>x.id==id);if(p.e<=0)return;cart.push(p);p.e--;S();document.getElementById('cq').innerText=cart.length;R()}
function RC(){document.getElementById('ci').innerHTML=cart.map(p=>`<div class="flex justify-between text-sm border-b py-2"><span>${p.n}</span><span>R$ ${p.p.toFixed(2)}</span></div>`).join('');document.getElementById('ct').innerText=cart.reduce((s,p)=>s+p.p,0).toFixed(2)}
function WZ(){if(!cart.length)return alert('Vazio');let t=cart.reduce((s,p)=>s+p.p,0);V.push({d:new Date().toLocaleString(),i:cart.map(p=>p.n),t});S();let txt=`Olá ${C.n}! Meu pedido:%0A`;cart.forEach(p=>txt+=`• ${p.n} - R$ ${p.p.toFixed(2)}%0A`);txt+=`Total R$ ${t.toFixed(2)}`;cart=[];document.getElementById('cq').innerText=0;CT(0);R();window.open(`https://wa.me/${C.z}?text=${txt}`,'_blank')}
function RP(){document.getElementById('pl').innerHTML=P.map(p=>`<div class="flex justify-between border rounded-xl p-2 mb-2"><span class="text-sm">${p.n} (${p.e})</span><button onclick="PA(${p.id})" class="bgold text-white px-3 rounded-lg">+</button></div>`).join('')}
function PA(id){let p=P.find(x=>x.id==id);if(p.e<=0)return alert('Sem estoque');p.e--;V.push({d:new Date().toLocaleString(),i:[p.n],t:p.p});S();RP();R();document.getElementById('pt').innerText=V.slice(-1)[0].t.toFixed(2)}
function PF(){alert('Venda registrada!')}
function RE(){document.getElementById('el').innerHTML=P.map(p=>`<div class="bg-white rounded-xl p-3 flex justify-between items-center"><span class="text-sm font-bold">${p.n}</span><span><input type="number" value="${p.p}" onchange="EP(${p.id},'p',this.value)" class="w-20 border rounded-lg p-1"><input type="number" value="${p.e}" onchange="EP(${p.id},'e',this.value)" class="w-16 border rounded-lg p-1"></span><button onclick="DP(${p.id})">🗑️</button></div>`).join('')}
function EP(id,k,v){let p=P.find(x=>x.id==id);p[k]=k=='p'?parseFloat(v):parseInt(v);S();R()}
function DP(id){if(confirm('Excluir?')){P=P.filter(p=>p.id!=id);S();RE();R()}}
function NP(){let n=prompt('Nome:');if(!n)return;let p=parseFloat(prompt('Preço:')||'0');let e=parseInt(prompt('Estoque:')||'0');P.push({id:Date.now(),n,c:'Geral',p,e});S();RE();R()}
function RR(){let t=V.reduce((s,v)=>s+v.t,0);document.getElementById('rb').innerHTML=`<div class="bg-white p-4 rounded-2xl"><b>R$ ${t.toFixed(2)}</b><div class="text-xs">Faturamento</div></div><div class="bg-white p-4 rounded-2xl"><b>${V.length}</b><div class="text-xs">Vendas</div></div>`}
function RH(){document.getElementById('hl').innerHTML=V.slice().reverse().map(v=>`<div class="bg-white p-3 rounded-xl text-sm"><b>${v.d} - R$ ${v.t.toFixed(2)}</b><div class="text-xs">${v.i.join(', ')}</div></div>`).join('')||'Sem vendas'}
function RB(){document.getElementById('bl').innerHTML=P.filter(p=>p.e<=5).map(p=>`<div class="bg-white p-3 rounded-xl flex justify-between"><span>${p.n}</span><b class="text-red-600">${p.e} un.</b></div>`).join('')||'Tudo ok'}
function SC(){C.z=document.getElementById('cz').value;C.n=document.getElementById('cn').value;S();alert('Salvo!')}
R();
</script></body></html>
