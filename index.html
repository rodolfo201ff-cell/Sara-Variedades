 ORDER.forEach(cat=>{

function filtered(){return PRODUCTS.filter(p=>(act=='Todos'||p.c==act)&&(!q||p.n.toLowerCase().includes(q.toLowerCase())))}

 renderCats();
 const list=filtered();
 document.getElementById('count').textContent=list.length+' produtos em '+act+' • '+PRODUCTS.length+' total';
 const g=document.getElementById('grid');g.innerHTML='';
 list.forEach(p=>{
