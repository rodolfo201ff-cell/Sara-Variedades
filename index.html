function renderCats(){let c=document.getElementById('cats');c.innerHTML='';let b=document.createElement('button');b.className='cat'+(act=='Todos'?' a':'');b.textContent='🌟 Todos';b.onclick=()=>{act='Todos';render()};c.appendChild(b);CATS.forEach(k=>{let e=document.createElement('button');e.className='cat'+(act==k?' a':'');e.textContent=ICONS[k]+' '+k;e.onclick=()=>{act=k;render()};c.appendChild(e)});}
function filtered(){return PRODUCTS.filter(p=>{return (act=='Todos'||p.categoria==act)&&(!q||p.nome.toLowerCase().includes(q.toLowerCase()))})}
function render(){renderCats();let list=filtered();document.getElementById('cnt').textContent=list.length+' produtos em '+act;document.getElementById('tit').textContent=act=='Todos'?'Todos os produtos':act+' em Belém/PA';let g=document.getElementById('grid');g.innerHTML='';list.forEach(p=>{let off=p.promo?Math.round((1-p.promo/p.preco)*100):0;let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="card-top">${p.emoji} ${off?`<span class=tag>${off}% OFF</span>`:''}</div><div class="card-b"><div style="font-size:12px;min-height:32px">${p.nome}</div><div style="color:#f5a623;font-size:11px">★★★★★ (${p.vend})</div><div class="price">${p.promo?`R$ ${p.promo.toFixed(2).replace('.',',')} <small style="color:#999;text-decoration:line-through">R$ ${p.preco.toFixed(2).replace('.',',')}</small>`: `R$ ${p.preco.toFixed(2).replace('.',',')}`}</div><button class="btn" onclick="add(${p.id})">Adicionar</button></div>`;g.appendChild(d)});upd();}
function add(id){let p=PRODUCTS.find(x=>x.id==id);let f=cart.find(x=>x.id==id);if(f)f.qtd++;else cart.push({...p,qtd:1});upd();document.getElementById('modal').classList.add('o')}
function upd(){document.getElementById('cc').textContent=cart.reduce((s,i)=>s+i.qtd,0);let tot=cart.reduce((s,i)=>s+(i.promo||i.preco)*i.qtd,0);document.getElementById('tot').textContent='R$ '+tot.toFixed(2).replace('.',',');let l=document.getElementById('list');l.innerHTML='';cart.forEach(i=>{l.innerHTML+=`<div style="display:flex;justify-content:space-between;border:1px solid #ffd6de;padding:6px;border-radius:8px"><span>${i.nome} x${i.qtd}</span><b>R$ ${((i.promo||i.preco)*i.qtd).toFixed(2)}</b></div>`})}
function tog(){document.getElementById('modal').classList.toggle('o')}
function zap(){if(!cart.length)return alert('vazio');let m='Olá Sara! Quero:%0A';cart.forEach(i=>{m+=`• ${i.nome} x${i.qtd}%0A`});window.open('https://wa.me/5591999999999?text='+m,'_blank')}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render()});render();
</script></body></html>
